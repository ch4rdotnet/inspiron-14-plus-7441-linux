# speaker crossover for the inspiron 14 plus 7441.
#
# the hardware sink is 4 channels FL,FR,RL,RR but the "rear" pair are the
# tweeters (WooferLeft/Right and TweeterLeft/Right in x1-dell-thena.dtsi).
# sending them full range works but puts bass into small drivers and leaves the
# balance wrong.
#
# this presents a normal stereo sink and splits it with a linkwitz-riley 4th
# order crossover at 4 khz, lows to the woofers, highs to the tweeters. lr4 is
# two cascaded butterworth biquads (q = 0.707) at the same frequency, which sum
# flat through the crossover region.
#
# 4 khz is a judgement call, not a measurement (the vendor's number is in the
# encrypted acdb, see docs/audio-vendor-tuning.md). to change it edit Freq on
# all eight biquads, they must match.
#
# remove this file and restart pipewire to go back to the plain sink.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers (crossover)"
            media.name       = "Speakers (crossover)"

            filter.graph = {
                nodes = [
                    { type = builtin name = dupL  label = copy        control = {} }
                    { type = builtin name = dupR  label = copy        control = {} }

                    { type = builtin name = lpL1  label = bq_lowpass  control = { "Freq" = 4000 "Q" = 0.707 } }
                    { type = builtin name = lpL2  label = bq_lowpass  control = { "Freq" = 4000 "Q" = 0.707 } }
                    { type = builtin name = lpR1  label = bq_lowpass  control = { "Freq" = 4000 "Q" = 0.707 } }
                    { type = builtin name = lpR2  label = bq_lowpass  control = { "Freq" = 4000 "Q" = 0.707 } }

                    { type = builtin name = hpL1  label = bq_highpass control = { "Freq" = 4000 "Q" = 0.707 } }
                    { type = builtin name = hpL2  label = bq_highpass control = { "Freq" = 4000 "Q" = 0.707 } }
                    { type = builtin name = hpR1  label = bq_highpass control = { "Freq" = 4000 "Q" = 0.707 } }
                    { type = builtin name = hpR2  label = bq_highpass control = { "Freq" = 4000 "Q" = 0.707 } }
                ]
                links = [
                    { output = "dupL:Out" input = "lpL1:In" }
                    { output = "lpL1:Out" input = "lpL2:In" }
                    { output = "dupL:Out" input = "hpL1:In" }
                    { output = "hpL1:Out" input = "hpL2:In" }

                    { output = "dupR:Out" input = "lpR1:In" }
                    { output = "lpR1:Out" input = "lpR2:In" }
                    { output = "dupR:Out" input = "hpR1:In" }
                    { output = "hpR1:Out" input = "hpR2:In" }
                ]
                inputs  = [ "dupL:In" "dupR:In" ]
                outputs = [ "lpL2:Out" "lpR2:Out" "hpL2:Out" "hpR2:Out" ]
            }

            capture.props = {
                node.name       = "effect_input.speaker-crossover"
                media.class     = Audio/Sink
                audio.channels  = 2
                audio.position  = [ FL FR ]
                # above the raw speaker sink (728) so the crossover is the default,
                # below headphones (1000) so plugging them in still switches away
                priority.session = 900
                priority.driver  = 900
            }
            playback.props = {
                node.name        = "effect_output.speaker-crossover"
                node.target      = "alsa_output.platform-sound.HiFi__Speaker__sink"
                audio.channels   = 4
                audio.position   = [ FL FR RL RR ]
                stream.dont-remix = true
                node.passive     = true
            }
        }
    }
]
