# the speaker sink is 4 channels FL,FR,RL,RR but the "rear" pair are the
# tweeters, not rear speakers. the default psd upmix synthesises rear from the
# L-R difference, which is nearly silent for centred content, so the tweeters
# starve and everything sounds muffled. simple copies front to rear instead.
# installed to both client.conf.d and pipewire-pulse.conf.d, because pulse
# clients (firefox) don't read client.conf. see docs/audio.md
stream.properties = {
    channelmix.upmix        = true
    channelmix.upmix-method = simple
}
