# the ftpm lives in trustzone and nothing upstream drives it on a dt boot, so
# tpm2.target waits out a 45s timeout twice per boot. this drops the tpm2-tss
# dracut module for tidiness, the part that actually saves the time is the
# rd.systemd.mask= kernel arguments. see docs/boot-time.md
omit_dracutmodules+=" tpm2-tss "
