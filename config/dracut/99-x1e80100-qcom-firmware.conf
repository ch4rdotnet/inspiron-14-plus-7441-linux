# adsp and cdsp firmware must be in the initramfs. qcom_q6v5_pas probes there and
# remoteproc auto-boot never retries a failed request_firmware(), so with the
# images only on the rootfs the adsp stays offline all boot (no battery, no
# audio, no usb-c pd). see docs/firmware.md
