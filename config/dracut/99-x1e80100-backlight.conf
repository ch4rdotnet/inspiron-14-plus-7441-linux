# the panel's backlight chain has to be in the initramfs or the luks prompt is
# drawn on a dead display:
#     panel -> backlight (pwm_bl) -> pmk8550_pwm (leds-qcom-lpg)
# without the pwm provider pwm-backlight defers, dp-aux defers on it, msm never
# finishes binding, and nothing lights the panel until after switch-root.
# force_drivers (not add_drivers) also writes a modules-load.d entry inside the
# initramfs, so they load even if udev coldplug doesn't match them.
# see docs/luks-black-screen.md
force_drivers+=" leds-qcom-lpg pwm_bl "
